[Settings]
gtk-application-prefer-dark-theme=false
gtk-button-images=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-cursor-theme-name=breeze_cursors
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Noto Sans,  10
gtk-icon-theme-name=breeze
gtk-menu-images=true
gtk-theme-name=Breeze
gtk-toolbar-style=3
gtk-xft-dpi=98304

# These two KDE-only GTK modules are absent on most distros (including this
# machine); GTK logs a warning for each. Only useful inside a full KDE Plasma
# session, where this file is not normally used at all. Non-KDE users: leave off.
# gtk-modules=colorreload-gtk-module:window-decorations-gtk-module
